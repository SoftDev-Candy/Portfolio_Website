<svg width="100" height="100" viewBox="0 0 40 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- lava ring stroke -->
    <linearGradient id="lavaGameRing" x1="10" y1="6" x2="30" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="hsl(18, 89%, 62%)" />
      <stop offset="0.6" stop-color="hsl(12, 74%, 54%)" />
      <stop offset="1" stop-color="hsl(20, 68%, 42%)" />
    </linearGradient>

    <!-- main lava fill for cube -->
    <linearGradient id="lavaGameFill" x1="12" y1="8" x2="28" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="hsl(18, 89%, 62%)" />
      <stop offset="0.55" stop-color="hsl(12, 74%, 54%)" />
      <stop offset="1" stop-color="hsl(20, 68%, 42%)" />
    </linearGradient>

    <!-- brighter lava for nodes / highlights -->
    <radialGradient id="lavaGameNode" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0" stop-color="hsl(18, 100%, 72%)" />
      <stop offset="1" stop-color="hsl(18, 89%, 62%)" />
    </radialGradient>
  </defs>

  <!-- overall scale to match your other icons -->
  <g transform="translate(20 16) scale(1.7) translate(-20 -16)">

    <!-- outer lava ring -->
    <circle
      cx="20" cy="16" r="10.5"
      fill="none"
      stroke="url(#lavaGameRing)"
      stroke-width="1.0"
      stroke-linejoin="round"
    />

    <!-- gear (background), nicely inside the ring -->
    <!-- original gear viewBox 0 0 24 24, centered at (12,12) -->
    <g transform="translate(20 16) scale(0.8) translate(-12 -12)">
      <path
        d="M20.017 14.669L23 13.564l-.012-3.208-2.996-1.085a8.455 8.455 0 0 0-.437-1.05l1.329-2.893-2.277-2.26-2.886 1.351a8.396 8.396 0 0 0-1.052-.436L13.564 1l-3.208.012-1.085 2.996a8.485 8.485 0 0 0-1.05.437L5.328 3.116l-2.26 2.276L4.419 8.28a8.378 8.378 0 0 0-.436 1.052L1 10.436l.012 3.208 2.996 1.085a8.46 8.46 0 0 0 .437 1.05l-1.329 2.893 2.276 2.26 2.887-1.351a8.383 8.383 0 0 0 1.052.436L10.436 23l3.208-.012 1.085-2.996a8.478 8.478 0 0 0 1.05-.437l2.893 1.329 2.26-2.276-1.351-2.887a8.382 8.382 0 0 0 .436-1.052zm-.287 3.73l-1.275 1.285-2.694-1.238-.429.215a7.612 7.612 0 0 1-.928.385l-.452.156-1.01 2.789-1.81.007-1.03-2.779-.456-.151a7.394 7.394 0 0 1-.926-.385l-.43-.21-2.688 1.257-1.286-1.275 1.239-2.695-.216-.43a7.551 7.551 0 0 1-.386-.926l-.155-.452-2.79-1.01-.005-1.81 2.777-1.03.152-.456a7.46 7.46 0 0 1 .384-.927l.212-.43L4.27 5.601l1.275-1.285 2.694 1.238.429-.215a7.612 7.612 0 0 1 .928-.385l.452-.156 1.01-2.789 1.81-.007 1.03 2.779.456.151a7.35 7.35 0 0 1 .925.385l.43.211L18.4 4.27l1.285 1.275-1.239 2.695.216.43a7.551 7.551 0 0 1 .386.926l.155.452 2.79 1.01.005 1.81-2.777 1.03-.152.456a7.46 7.46 0 0 1-.384.927l-.212.43zM12 7.2a4.8 4.8 0 1 0 4.8 4.8A4.8 4.8 0 0 0 12 7.2zm0 8.6a3.8 3.8 0 1 1 3.8-3.8 3.804 3.804 0 0 1-3.8 3.8z"
        fill="none"
        stroke="url(#lavaGameRing)"
        stroke-width="0.9"
        stroke-linejoin="round"
      />
    </g>

    <!-- cube + axes logo fully inside the gear, dead center -->
    <g transform="translate(20 16) scale(0.3) translate(-20 -16)">

      <!-- isometric cube core -->
      <!-- top face -->
      <path
        d="M20 8 L28 12 L20 16 L12 12 Z"
        fill="url(#lavaGameFill)"
        fill-opacity="0.95"
        stroke="black"
        stroke-opacity="0.6"
        stroke-width="0.7"
        stroke-linejoin="round"
      />
      <!-- left face -->
      <path
        d="M12 12 L20 16 L20 24 L12 20 Z"
        fill="url(#lavaGameFill)"
        fill-opacity="0.85"
        stroke="black"
        stroke-opacity="0.6"
        stroke-width="0.7"
        stroke-linejoin="round"
      />
      <!-- right face -->
      <path
        d="M28 12 L20 16 L20 24 L28 20 Z"
        fill="url(#lavaGameFill)"
        fill-opacity="0.9"
        stroke="black"
        stroke-opacity="0.6"
        stroke-width="0.7"
        stroke-linejoin="round"
      />

      <!-- axes coming out of cube center -->
      <g stroke="hsl(0, 0%, 82%)" stroke-width="0.8" stroke-linecap="round">
        <!-- Y axis up -->
        <line x1="20" y1="16" x2="20" y2="4" />
        <!-- X axis right -->
        <line x1="20" y1="16" x2="32" y2="22" />
        <!-- Z-ish axis left -->
        <line x1="20" y1="16" x2="8" y2="22" />
      </g>

      <!-- axis arrowheads -->
      <g stroke="hsl(0, 0%, 85%)" stroke-width="0.7" stroke-linecap="round">
        <!-- Y arrow -->
        <line x1="19" y1="5" x2="20" y2="4" />
        <line x1="21" y1="5" x2="20" y2="4" />
        <!-- X arrow -->
        <line x1="31" y1="21" x2="32" y2="22" />
        <line x1="31.8" y1="23" x2="32" y2="22" />
        <!-- Z arrow -->
        <line x1="9" y1="21" x2="8" y2="22" />
        <line x1="9" y1="23" x2="8" y2="22" />
      </g>

      <!-- lava “nodes” at axis ends + cube center -->
      <circle cx="20" cy="16" r="1.4" fill="url(#lavaGameNode)" />
      <circle cx="20" cy="4"  r="1.2" fill="url(#lavaGameNode)" />
      <circle cx="32" cy="22" r="1.2" fill="url(#lavaGameNode)" />
      <circle cx="8"  cy="22" r="1.2" fill="url(#lavaGameNode)" />
    </g>

  </g>
</svg>
