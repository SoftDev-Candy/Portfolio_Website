    <circle
      cx="20" cy="16" r="10.5"
      fill="none"
      stroke="url(#lavaDualRing)"
      stroke-width="1.0"
      stroke-linejoin="round"
    />

    <!-- vertical separator as a lava rectangle cutting the circle exactly -->
    <!-- circle center: (20,16), radius: 10.5 -> diameter from y = 5.5 to 26.5 -->
    <rect
      x="19.4"
      y="5.5"
      width="1.2"
      height="21"
      fill="url(#lavaDualRing)"
      rx="0.6"
      ry="0.6"
    />

