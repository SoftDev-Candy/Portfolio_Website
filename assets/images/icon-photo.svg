<svg width="100" height="100" viewBox="0 0 40 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- lava ring stroke -->
    <linearGradient id="lavaDualRing" x1="10" y1="6" x2="30" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="hsl(18, 89%, 62%)" />
      <stop offset="0.6" stop-color="hsl(12, 74%, 54%)" />
      <stop offset="1" stop-color="hsl(20, 68%, 42%)" />
    </linearGradient>

    <!-- left icon (heart / volunteering) -->
    <radialGradient id="lavaVolIcon" cx="0.5" cy="0.4" r="0.8">
      <stop offset="0" stop-color="hsl(18, 100%, 74%)" />
      <stop offset="1" stop-color="hsl(18, 89%, 62%)" />
    </radialGradient>

    <!-- right icon (hackathon) -->
    <radialGradient id="lavaHackIcon" cx="0.5" cy="0.5" r="0.9">
      <stop offset="0" stop-color="hsl(18, 100%, 72%)" />
      <stop offset="1" stop-color="hsl(12, 74%, 54%)" />
    </radialGradient>
  </defs>

  <!-- center + scale -->
  <g transform="translate(20 16) scale(1.8) translate(-20 -16)">

