<svg width="100" height="100" viewBox="0 0 40 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- lava gradient for server outlines -->
    <linearGradient id="lavaBackendStroke" x1="8" y1="6" x2="32" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="hsl(18, 89%, 62%)" />
      <stop offset="0.6" stop-color="hsl(12, 74%, 54%)" />
      <stop offset="1" stop-color="hsl(20, 68%, 42%)" />
    </linearGradient>

    <!-- lava for LEDs / hub -->
    <radialGradient id="lavaLed" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0" stop-color="hsl(18, 100%, 70%)" />
      <stop offset="1" stop-color="hsl(18, 89%, 62%)" />
    </radialGradient>
  </defs>

  <!-- everything below scales like your satellite: change 0.66 to tweak -->
  <g transform="translate(20 16) scale(1.5) translate(-20 -16)">

    <!-- three stacked server blocks -->
    <g fill="none" stroke="url(#lavaBackendStroke)" stroke-width="0.9">
      <rect x="8" y="7"  width="24" height="5" rx="2" />
      <rect x="8" y="13" width="24" height="5" rx="2" />
      <rect x="8" y="19" width="24" height="5" rx="2" />
    </g>

    <!-- lava status LEDs on the left -->
    <circle cx="10.5" cy="9.5"  r="1.0" fill="url(#lavaLed)" />
    <circle cx="10.5" cy="15.5" r="1.0" fill="url(#lavaLed)" />
    <circle cx="10.5" cy="21.5" r="1.0" fill="url(#lavaLed)" />

    <!-- signal lines on the right of each server -->
    <g stroke="hsl(0, 0%, 80%)" stroke-width="0.6" stroke-linecap="round">
      <line x1="16" y1="9.5"  x2="20" y2="9.5" />
      <line x1="21.5" y1="9.5" x2="24.5" y2="9.5" />

      <line x1="16" y1="15.5" x2="22" y2="15.5" />
      <line x1="23.5" y1="15.5" x2="25.5" y2="15.5" />

      <line x1="16" y1="21.5" x2="21" y2="21.5" />
      <line x1="22.5" y1="21.5" x2="24" y2="21.5" />
    </g>

    <!-- bottom hub + connections -->
    <g stroke="hsl(0, 0%, 70%)" stroke-width="0.6" stroke-linecap="round">
      <!-- vertical from middle server stack -->
      <line x1="20" y1="24" x2="20" y2="27" />
      <!-- fan-out lines -->
      <line x1="20" y1="27" x2="16.5" y2="29" />
      <line x1="20" y1="27" x2="23.5" y2="29" />
    </g>

    <!-- central hub node -->
    <circle cx="20" cy="27" r="1.3" fill="url(#lavaLed)" />

  </g>
</svg>
